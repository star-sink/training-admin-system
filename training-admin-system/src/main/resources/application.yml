server:
  port: 8081

spring:
  application:
    name: training-admin-system
  # 数据库连接信息：本地开发在下方填写；生产环境请使用环境变量/配置中心，避免提交真实密码
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/training?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: "******"
    password: "******"
  servlet:
    multipart:
      # 最大单个文件大小
      max-file-size: 10MB
      # 最大请求大小（包括所有文件和表单数据）
      max-request-size: 100MB

# MyBatis 配置
mybatis:
  configuration:
    # 开启驼峰命名映射
    map-underscore-to-camel-case: true

logging:
  level:
    com.trainingadmin.mapper: debug
    org.springframework.jdbc.support.JdbcTransactionManager: debug

# 阿里云 OSS（仅文件上传功能需要；未配置完整时应用仍可正常启动，仅上传接口不可用）
# AccessKey 从环境变量 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 读取，不要写入此文件
aliyun:
  oss:
    endpoint: "*****************"
    bucketName: "*******"
    region: "*******"