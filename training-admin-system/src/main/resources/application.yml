server:
  port: 8081

spring:
  application:
    name: training-admin-system
  # 数据库连接信息：本地开发可直接使用默认值，生产环境通过环境变量覆盖
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/training?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  servlet:
    multipart:
      # 最大单个文件大小
      max-file-size: 10MB
      # 最大请求大小（包括所有文件和表单数据）
      max-request-size: 100MB

# MyBatis 配置
mybatis:
  configuration:
    # 开启驼峰命名映射
    map-underscore-to-camel-case: true

logging:
  level:
    com.trainingadmin.mapper: debug
    org.springframework.jdbc.support.JdbcTransactionManager: debug

# JWT 配置
jwt:
  # 生产环境务必通过环境变量 JWT_SECRET 覆盖，长度至少 32 字节
  secret: ${JWT_SECRET:training-admin-system-jwt-secret-please-change-in-production-2026}
  # 令牌有效期（毫秒），默认 12 小时
  expiration: ${JWT_EXPIRATION:43200000}

# 阿里云 OSS（仅文件上传功能需要，不配置不影响应用启动）
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket-name: ${OSS_BUCKET_NAME:}
    region: ${OSS_REGION:}
